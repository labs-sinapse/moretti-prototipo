  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  FORMS[f.dataset.form](new FormData(f), f, e.submitter);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) closeSheet();
  if (e.key === 'Tab' && S.sheet) {
    const f = [...sheetRoot().querySelectorAll('button:not([disabled]), input, textarea, [href]')].filter(el => el.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

/* ============ gestures ============
   Touch never drags on Operação: a card is tapped (open), its pills are tapped (sheets),
   or it is held (actions sheet). Listeners here are passive, so a vertical swipe always scrolls.
   Dragging between columns exists only for mouse/pen on the desktop board (Kanban below).
   The order list (Reorder) lifts an item only after a still 350 ms hold. */

const Press = (() => {
  const HOLD = 450, SLOP = 8;
  let st = null;
  function cancel() {
    if (!st) return;
    clearTimeout(st.timer); clearTimeout(st.cue);
    st.card.classList.remove('pressing');
    st = null;
  }
  function fire() {
    if (!st) return;
    const { card, id } = st;
    st.fired = true;
    card.classList.remove('pressing'); card.classList.add('lifted');
    navigator.vibrate?.(8);
    setTimeout(() => card.classList.remove('lifted'), 360);
    openSheet({ type: 'actions', actId: id });
  }
  document.addEventListener('touchstart', e => {
    cancel();
    const card = e.target.closest('.ac[data-press]');
    if (!card || e.touches.length > 1 || e.target.closest('button')) return;
    const t = e.touches[0];
    st = { card, id: card.dataset.press, x: t.clientX, y: t.clientY, fired: false };
    st.cue = setTimeout(() => st?.card.classList.add('pressing'), 140);
    st.timer = setTimeout(fire, HOLD);
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!st || st.fired) return;
    const t = e.touches[0];
    if (Math.hypot(t.clientX - st.x, t.clientY - st.y) > SLOP) cancel();
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (st?.fired) S.suppressClick = Date.now() + 700;
    cancel();
  }, { passive: true });
  document.addEventListener('touchcancel', cancel, { passive: true });
  addEventListener('scroll', cancel, { passive: true });
  document.addEventListener('contextmenu', e => {
    const card = e.target.closest('.ac[data-press]');
    if (!card) return;
    e.preventDefault();
    if (S.sheet?.type === 'actions' && S.sheet.actId === card.dataset.press) return;
    openSheet({ type: 'actions', actId: card.dataset.press });
  });
  return { state: () => st };
})();

const Reorder = (() => {
  const HOLD = 350, SLOP = 8;
  let st = null;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function bind(list) {
    if (!list || list.dataset.bound) return;
    list.dataset.bound = '1';
    list.addEventListener('touchstart', onTouchStart, { passive: true });
    list.addEventListener('touchmove', onTouchMove, { passive: false });
    list.addEventListener('touchend', onTouchEnd);
    list.addEventListener('touchcancel', () => (st?.mode === 'drag' ? finish(false) : abort()));
    list.addEventListener('pointerdown', onPointerDown);
  }
  const itemFrom = target => {
    const li = target.closest('.ord');
    return li && !li.classList.contains('ord-anchor') && !target.closest('button') ? li : null;
  };
  function onTouchStart(e) {
    abort();
    const li = itemFrom(e.target);
    if (!li || e.touches.length > 1) return;
    const t = e.touches[0];
    st = { mode: 'press', li, list: li.parentElement, x0: t.clientX, y0: t.clientY, cy: t.clientY };
    st.timer = setTimeout(() => begin(st.y0), HOLD);
  }
  function onTouchMove(e) {
    if (!st) return;
    const t = e.touches[0];
    if (st.mode === 'press') { if (Math.hypot(t.clientX - st.x0, t.clientY - st.y0) > SLOP) abort(); return; }
    e.preventDefault();
    st.cy = t.clientY;
    update();
  }
  function onTouchEnd() {
    if (!st) return;
    if (st.mode === 'drag') { S.suppressClick = Date.now() + 600; finish(true); } else abort();
  }
  function onPointerDown(e) {
    if (e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
    if (e.button !== 0) return;
    const li = itemFrom(e.target);
    if (!li) return;
    e.preventDefault();
    st = { mode: 'mpress', li, list: li.parentElement, x0: e.clientX, y0: e.clientY, cy: e.clientY };
    addEventListener('pointermove', onPointerMove);
    addEventListener('pointerup', onPointerUp, { once: true });
  }
  function onPointerMove(e) {
    if (!st) return;
    if (st.mode === 'mpress') { if (Math.hypot(e.clientX - st.x0, e.clientY - st.y0) < 4) return; begin(st.y0); }
    st.cy = e.clientY;
    update();
  }
  function onPointerUp() {
    removeEventListener('pointermove', onPointerMove);
    if (!st) return;
    if (st.mode === 'drag') { S.suppressClick = Date.now() + 300; finish(true); } else abort();
  }
  function begin(clientY) {
    if (!st) return;
    const items = [...st.list.children];
    Object.assign(st, { mode: 'drag', items, i0: items.indexOf(st.li), startY: clientY + scrollY });
    st.idx = st.i0;
    st.rects = items.map(el => { const r = el.getBoundingClientRect(); return { top: r.top + scrollY, h: r.height }; });
    st.h = st.rects[st.i0].h;
    st.li.classList.add('lifted');
    items.forEach(el => el !== st.li && el.classList.add('shift'));
    document.body.classList.add('reordering');
    navigator.vibrate?.(10);
    loop();
  }
  function update() {
    if (st?.mode !== 'drag') return;
    const r0 = st.rects[st.i0], last = st.rects[st.rects.length - 1];
    const dy = clamp(st.cy + scrollY - st.startY, st.rects[0].top - r0.top, last.top + last.h - r0.top - st.h);
    st.li.style.transform = `translateY(${dy}px)`;
    const center = r0.top + st.h / 2 + dy;
    let idx = 0;
    st.rects.forEach((r, j) => { if (j !== st.i0 && r.top + r.h / 2 < center) idx++; });
    st.idx = idx;
    st.items.forEach((el, j) => {
      if (j === st.i0) return;
      const shift = st.i0 < idx && j > st.i0 && j <= idx ? -st.h : st.i0 > idx && j >= idx && j < st.i0 ? st.h : 0;
      el.style.transform = shift ? `translateY(${shift}px)` : '';
    });
  }
  function loop() {
    if (st?.mode !== 'drag') return;
    const top = 120, bottom = innerHeight - 120;
    const v = st.cy < top ? -Math.min(16, (top - st.cy) / 5) : st.cy > bottom ? Math.min(16, (st.cy - bottom) / 5) : 0;
    if (v) { window.scrollBy(0, v); update(); }
    st.raf = requestAnimationFrame(loop);
  }
  function finish(commit) {
    const s = st; st = null;
    cancelAnimationFrame(s.raf);
    const ids = s.items.map(el => el.dataset.id);
    const [moved] = ids.splice(s.i0, 1);
    ids.splice(s.idx, 0, moved);
    const changed = commit && s.idx !== s.i0;
    const done = () => {
      s.items.forEach(el => { el.classList.remove('shift', 'lifted', 'settle'); el.style.transform = ''; });
      document.body.classList.remove('reordering');
      if (changed) { S.ui.orderDraft[s.list.dataset.order] = ids; render(); flash(moved); }
    };
    if (reduceMotion()) return done();
    const slot = changed ? s.rects[s.idx].top - s.rects[s.i0].top + (s.idx > s.i0 ? s.rects[s.idx].h - s.h : 0) : 0;
    if (!changed) s.items.forEach(el => { if (el !== s.li) el.style.transform = ''; });
    s.li.classList.add('settle');
    s.li.classList.remove('lifted');
    s.li.style.transform = `translateY(${slot}px)`;
    setTimeout(done, 210);
  }
  function abort() {
    if (!st) return;
    clearTimeout(st.timer);
    removeEventListener('pointermove', onPointerMove);
    st = null;
  }
  return { bind, state: () => st && { mode: st.mode, idx: st.idx } };
})();

const Kanban = (() => {
  let st = null;
  document.addEventListener('pointerdown', e => {
    if ((e.pointerType !== 'mouse' && e.pointerType !== 'pen') || e.button !== 0) return;
    const card = e.target.closest('.board .ac[data-press]');
    if (!card || e.target.closest('button')) return;
    st = { card, cw: card.closest('.cw'), id: card.dataset.press, x0: e.clientX, y0: e.clientY, started: false, target: null };
  });
  document.addEventListener('pointermove', e => {
    if (!st) return;
    if (!st.started) { if (Math.hypot(e.clientX - st.x0, e.clientY - st.y0) < 5) return; start(e); }
    move(e);
  });
  document.addEventListener('pointerup', () => { if (!st) return; const s = st; st = null; if (s.started) finish(s); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && st?.started) { cleanup(st); st = null; } });
  document.addEventListener('dragstart', e => { if (e.target.closest?.('.ac, .ord')) e.preventDefault(); });
  function start(e) {
    const r = st.card.getBoundingClientRect();
    Object.assign(st, { started: true, dx: e.clientX - r.left, dy: e.clientY - r.top });
    st.ghost = st.card.cloneNode(true);
    st.ghost.classList.add('ghost');
    st.ghost.style.width = r.width + 'px';
    document.body.appendChild(st.ghost);
    st.cw.classList.add('placeholder');
    document.body.classList.add('dragging');
    document.querySelectorAll('.board [data-no-drop]').forEach(c => c.classList.add('no-drop'));
  }
  function move(e) {
    st.ghost.style.transform = `translate(${e.clientX - st.dx}px, ${e.clientY - st.dy}px) rotate(1.2deg)`;
    const col = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-drop-status], [data-drop-prazo]') || null;
    if (col !== st.target) { st.target?.classList.remove('drop-on'); col?.classList.add('drop-on'); st.target = col; }
    const board = document.querySelector('.board');
    if (board) { const br = board.getBoundingClientRect(); if (e.clientX > br.right - 80) board.scrollLeft += 14; else if (e.clientX < br.left + 80) board.scrollLeft -= 14; }
  }
  function cleanup(s) {
    s.ghost?.remove();
    s.cw.classList.remove('placeholder');
    s.target?.classList.remove('drop-on');
    document.body.classList.remove('dragging');
    document.querySelectorAll('.no-drop').forEach(c => c.classList.remove('no-drop'));
  }
  function finish(s) {
    cleanup(s);
    S.suppressClick = Date.now() + 300;
    if (!s.target) return;
    const a = act(s.id);
    if (s.target.dataset.dropStatus) {
      const ns = s.target.dataset.dropStatus;
      if (ns === a.status) return;
      if (!canChangeStatus(a)) return toast('Só o Responsável, o Diretor ou os Gerentes mudam o status desta atividade.', null, { icon: 'lock' });
      setStatus(a.id, ns, `Movida para ${statusLabel(ns)}`);
    } else {
      const nd = bucketDate(s.target.dataset.dropPrazo);
      if ((a.prazo || null) === nd) return;
      if (!canChangeDate()) return toast('Só o Diretor ou os Gerentes mudam prazos.', null, { icon: 'lock' });
      setDate(a.id, nd);
    }
  }
  return { state: () => st && { started: st.started } };
})();

/* Sheet: drag the handle area down to dismiss. */
(() => {
  let sd = null;
  document.addEventListener('touchstart', e => {
    const head = e.target.closest('[data-sheet-drag]');
    if (!head || e.target.closest('button') || isDesktop()) return;
    sd = { sheet: head.closest('.sheet'), y0: e.touches[0].clientY, t0: performance.now(), dy: 0 };
    sheetRoot().classList.add('dragging');
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!sd) return;
    const raw = e.touches[0].clientY - sd.y0;
    sd.dy = raw > 0 ? raw : raw / 6;
    sd.sheet.style.transform = `translateY(${sd.dy}px)`;
  }, { passive: true });
  const end = () => {
    if (!sd) return;
    const { sheet, dy, t0 } = sd; sd = null;
    const root = sheetRoot();
    root.classList.remove('dragging');
    const fast = dy / Math.max(1, performance.now() - t0) > 0.6;
    if (dy > 96 || (fast && dy > 24)) { closeSheet(); requestAnimationFrame(() => { sheet.style.transform = ''; }); }
    else sheet.style.transform = '';
  };
  document.addEventListener('touchend', end, { passive: true });
  document.addEventListener('touchcancel', end, { passive: true });
})();

/* Chart tooltips: hover with a mouse, tap on touch. */
let tipTimer = 0;
const tipEl = () => document.getElementById('tip');
function showTip(t, x, y) {
  const el = tipEl(); el.innerHTML = t.dataset.tip; el.classList.add('on'); el.removeAttribute('aria-hidden');
  const r = el.getBoundingClientRect();
  el.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x - r.width / 2)) + 'px';
  el.style.top = Math.max(8, y - r.height - 14) + 'px';
}
function hideTip() { const el = tipEl(); if (!el) return; el.classList.remove('on'); el.setAttribute('aria-hidden', 'true'); }
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const t = e.target.closest?.('[data-tip]');
  if (t) showTip(t, e.clientX, e.clientY); else hideTip();
}, { passive: true });
document.addEventListener('click', e => {
  const t = e.target.closest?.('[data-tip]');
  if (!t || matchMedia('(hover:hover)').matches) return;
  showTip(t, e.clientX, e.clientY);
  clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 2400);
});
addEventListener('scroll', hideTip, { passive: true });

/* Material ripple. A finger that starts a scroll (pointercancel, or movement past the slop before
   the wave shows) never gets a wave, so scrolling a list never flashes the cards under it.
   Mouse and pen get the wave at once. Off with reduced motion; the CSS state layer still marks the press. */
const Ripple = (() => {
  const SEL = '.btn,.icon-btn,.tab,.side-nav a,.opt,.wi,a.wg-head,.row,.pcard,.office,.pulse-cell,.strat-entry,.quiet-link,.fab,.side-fab,.searchbar,.side-search,.seg button,.tab-btn,.dchip,.fchip,.fchip-clear,.filter-btn,button.pill,.cobrar-btn,.cal-day,.choice,.demo-switch,.side-me,.side-brand,.me-btn,.back-link,.link-out,.ac[data-press],details.grp summary';
  let pend = null, live = null;
  function spawn(host, x, y, quick) {
    const r = host.getBoundingClientRect();
    const size = 2 * Math.hypot(Math.max(x - r.left, r.right - x), Math.max(y - r.top, r.bottom - y));
    const clip = document.createElement('span');
    clip.className = 'rpl'; clip.setAttribute('aria-hidden', 'true');
    clip.innerHTML = `<i style="width:${size}px;height:${size}px;left:${x - r.left - size / 2}px;top:${y - r.top - size / 2}px"></i>`;
    host.appendChild(clip);
    live = clip;
    if (quick) setTimeout(() => release(clip), 160);
  }
  function release(clip = live) {
    if (!clip) return;
    if (clip === live) live = null;
    clip.classList.add('out');
    setTimeout(() => clip.remove(), 420);
  }
  const drop = () => { if (pend) { clearTimeout(pend.t); pend = null; } };
  document.addEventListener('pointerdown', e => {
    drop(); release();
    if (e.button !== 0 || reduceMotion()) return;
    const host = e.target.closest(SEL);
    if (!host || host.disabled || host.closest('.ghost')) return;
    if (e.pointerType !== 'touch') return spawn(host, e.clientX, e.clientY);
    pend = { host, x: e.clientX, y: e.clientY };
    pend.t = setTimeout(() => { if (pend) { spawn(pend.host, pend.x, pend.y); pend = null; } }, 90);
  }, { passive: true });
  document.addEventListener('pointermove', e => { if (pend && Math.hypot(e.clientX - pend.x, e.clientY - pend.y) > 8) drop(); }, { passive: true });
  document.addEventListener('pointerup', () => {
    if (pend) { clearTimeout(pend.t); spawn(pend.host, pend.x, pend.y, true); pend = null; } else release();
  }, { passive: true });
  document.addEventListener('pointercancel', () => { drop(); release(); }, { passive: true });
  addEventListener('scroll', () => { drop(); }, { passive: true });
  return { SEL };
})();

/* ============ boot ============ */
(function boot() {
  if (!location.hash || location.hash === '#' || location.hash === '#/') history.replaceState(null, '', location.pathname + location.search + '#/entrar');
  applyParams();
  S.prevHash = location.hash;
  render();
})();
</script>
